# CI/CD Pipeline for SitecoreAPIGraphQLClient
# Builds, tests, verifies coverage across .NET 8/9/10, and publishes .nupkg + .snupkg via NuGet OIDC Trusted Publishing.

name: NuGet Release Pipeline

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: '8.0.x'
            tfm: 'net8.0'
          - dotnet: '9.0.x'
            tfm: 'net9.0'
          - dotnet: '10.0.x'
            tfm: 'net10.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore solution
        run: dotnet restore Sitecore.API.Foundation.GraphQL.slnx

      - name: Build solution (${{ matrix.tfm }})
        run: dotnet build Sitecore.API.Foundation.GraphQL.slnx --configuration Release --no-restore

      - name: Test with coverage (${{ matrix.tfm }})
        run: |
          dotnet test tests/Sitecore.API.Foundation.GraphQL.Tests/Sitecore.API.Foundation.GraphQL.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --framework ${{ matrix.tfm }} \
            --results-directory ./TestResults/${{ matrix.tfm }}

      - name: Verify >= 80% line coverage (${{ matrix.tfm }})
        run: |
          python3 - "${{ matrix.tfm }}" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          tfm = sys.argv[1]
          files = glob.glob(f"./TestResults/{tfm}/**/coverage.cobertura.xml", recursive=True)
          if not files:
              raise SystemExit(f"No coverage.cobertura.xml found under ./TestResults/{tfm}")

          tree = ET.parse(files[0])
          pkg = tree.find(".//package[@name='Sitecore.API.Foundation.GraphQL']")
          if pkg is None:
              raise SystemExit("Package Sitecore.API.Foundation.GraphQL not found in coverage report.")

          line_rate = float(pkg.attrib["line-rate"])
          public_prefixes = (
              "Sitecore.API.Foundation.GraphQL.SitecoreGraphQLFactory",
              "Sitecore.API.Foundation.GraphQL.SitecoreGraphQLOptions",
              "Sitecore.API.Foundation.GraphQL.SitecoreGraphQLClientOptions",
              "Sitecore.API.Foundation.GraphQL.SitecoreGraphQLDiagnostics",
              "Sitecore.API.Foundation.GraphQL.Http.SitecoreTokenHandler",
              "Sitecore.API.Foundation.GraphQL.DependencyInjection.ServiceCollectionExtensions",
          )
          pub_valid = 0
          pub_covered = 0
          for cls in pkg.findall(".//class"):
              name = cls.attrib.get("name", "")
              if name.startswith(public_prefixes):
                  for line in cls.findall("./lines/line"):
                      pub_valid += 1
                      if int(line.attrib.get("hits", "0")) > 0:
                          pub_covered += 1

          pub_rate = (pub_covered / pub_valid) if pub_valid else 1.0
          print(f"[{tfm}] Overall line coverage: {line_rate:.2%}; Public API line coverage: {pub_rate:.2%} ({pub_covered}/{pub_valid})")
          if line_rate < 0.80:
              raise SystemExit(f"Overall line coverage {line_rate:.2%} is below 80% threshold.")
          if pub_rate < 0.80:
              raise SystemExit(f"Public API line coverage {pub_rate:.2%} is below 80% threshold.")
          PY

      - name: Upload test results (${{ matrix.tfm }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testresults-${{ matrix.tfm }}
          path: ./TestResults/${{ matrix.tfm }}

  pack-and-publish:
    name: Pack and Publish
    needs: build-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Validate NuGet OIDC configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Environment variable NUGET_USER is not set. Configure NUGET_USER in the 'nuget' GitHub Environment settings."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Verify tag matches PackageVersion
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          CSPROJ_VERSION=$(dotnet msbuild src/Sitecore.API.Foundation.GraphQL/Sitecore.API.Foundation.GraphQL.csproj -getProperty:PackageVersion | tr -d '[:space:]')
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Git tag version ($TAG_VERSION) does not match MSBuild PackageVersion ($CSPROJ_VERSION)."
            exit 1
          fi

      - name: Restore solution
        run: dotnet restore Sitecore.API.Foundation.GraphQL.slnx

      - name: Pack NuGet and symbol packages
        run: |
          dotnet pack src/Sitecore.API.Foundation.GraphQL/Sitecore.API.Foundation.GraphQL.csproj \
            --configuration Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            --output ./nupkgs

      - name: Upload NuGet and symbol packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: |
            ./nupkgs/SitecoreAPIGraphQLClient*.nupkg
            ./nupkgs/SitecoreAPIGraphQLClient*.snupkg

      - name: NuGet Login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkgs/SitecoreAPIGraphQLClient*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          bodyFile: CHANGELOG.md
          artifacts: ./nupkgs/SitecoreAPIGraphQLClient*.nupkg,./nupkgs/SitecoreAPIGraphQLClient*.snupkg
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
